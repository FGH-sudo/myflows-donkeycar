[project]
name = "testmyflow"
version = "0.1.0"
description = "深度学习框架课程项目与 CUDA 卷积算子实验"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6",
    "cupy-cuda12x==14.0.1",
    "Pillow==12.1.1",
    "scikit-learn==1.8.0",
    "onnx==1.21.0",
    "tensorboard==2.20.0",
    "psutil==7.2.2",
    "matplotlib==3.10.8",
    "opencv-python==4.13.0.92",
    "grpcio==1.83.1",
    "grpcio-tools==1.83.1",
    # cupy-cuda12x needs CUDA 12 headers/runtime for NVRTC; keep this separate
    # from the system CUDA Toolkit used to build the native DLL.
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
]

[dependency-groups]
console = [
    "fastapi>=0.141.1",
    "nvidia-ml-py>=13.610.43",
    "optuna>=4.0",
    "uvicorn>=0.53.0",
]
dev = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "ruff>=0.13.0",
    # Match the separately installed torch 2.11.0+cu128 wheel's constraint.
    "setuptools<82",
]
donkeycar = [
    # mycar/manage.py 模拟器驾驶；manage.py 直接调用 gymnasium 版 gym-donkeycar（GitHub 提交，见 tool.uv.sources）。
    "donkeycar==5.3.0",
    "gym-donkeycar",
    "gymnasium==1.3.0",
]
onnx = [
    # ONNX 评估、推理服务、INT8 量化和驾驶 pilot；CUDA/cuDNN DLL 复用本地 PyTorch wheel 自带的版本。
    "onnxruntime-gpu==1.26.0",
]

[tool.uv]
# 仓库包含多个独立的课程/仿真模块，不把根目录作为可安装 Python 包。
package = false
default-groups = ["dev", "console", "onnx", "donkeycar"]
# donkeycar 5.3.0 声明 numpy<2，但实际与项目锁定的 numpy 2.2.6 一起运行正常；
# 用覆盖保持全仓库统一的 numpy 版本。
override-dependencies = ["numpy==2.2.6"]

[tool.uv.sources]
gym-donkeycar = { git = "https://github.com/tawnkramer/gym-donkeycar", rev = "a1f4ca6961e17a6929c1f2e883358a1edafb479d" }
