name: CPU regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ci.txt
      - name: Run framework and application tests
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m tools.run_tests --scope all 2>&1 | tee ci-tests.log
      - name: Archive results and skip reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-regression-log
          path: ci-tests.log
          if-no-files-found: ignore
